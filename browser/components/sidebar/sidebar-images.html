<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      img-src deliberately stays limited to the same set the other sidebar
      panels use, plus moz-remote-image: for the thumbnails. Loading the page's
      original images directly here would mean a chrome document fetching
      arbitrary remote resources; the thumbnail is a re-encoded copy, which is
      exactly what the acceptance criteria allow for preview (the file that
      gets SAVED is still the original bytes).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src resource: chrome:; object-src 'none'; img-src data: chrome: moz-remote-image:;"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="sidebar-images-title"></title>
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/sidebar.ftl" />
    <link rel="localization" href="browser/firefoxView.ftl" />
    <link rel="localization" href="toolkit/branding/brandings.ftl" />
    <link rel="localization" href="toolkit/global/textActions.ftl" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/sidebar/sidebar.css"
    />
    <script
      type="module"
      src="chrome://browser/content/firefoxview/fxview-empty-state.mjs"
    ></script>
    <script
      type="module"
      src="chrome://browser/content/sidebar/sidebar-images.mjs"
    ></script>
    <script src="chrome://browser/content/contentTheme.js"></script>
    <script src="chrome://global/content/globalOverlay.js"></script>
    <script src="chrome://global/content/editMenuOverlay.js"></script>
  </head>

  <body>
    <sidebar-images />
  </body>
</html>
